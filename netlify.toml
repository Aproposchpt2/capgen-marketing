[build]
  publish = "."
  command = ""

# CapGen is retired. Keep the legacy host crawlable and issue permanent redirects
# so search engines and AI systems can consolidate historical signals into the
# current APROPOS federal procurement property.
#
# Specific legacy resources are mapped first to the closest canonical RFCP page.
# The final catch-all retires all remaining CapGen URLs to the RFCP homepage.

[[redirects]]
  from = "/guides/how-to-find-government-contracts.html"
  to = "https://federalcontractorportal.aproposgroupllc.com/guides/how-to-find-government-contracts/"
  status = 301
  force = true

