[build]
  publish = "."
  command = ""

# CapGen is retired. Preserve crawl access so search engines and AI systems can
# observe permanent redirects and consolidate historical signals into the
# current APROPOS federal procurement property.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://federalcontractorportal.aproposgroupllc.com/sitemap.xml"
  status = 301
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://federalcontractorportal.aproposgroupllc.com/robots.txt"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "https://federalcontractorportal.aproposgroupllc.com/"
  status = 301
  force = true
